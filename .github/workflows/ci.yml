name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-plugin:
    name: プラグインマニフェストの検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Claude Code をインストール
        run: npm install -g @anthropic-ai/claude-code

      - name: plugin validate --strict
        run: claude plugin validate . --strict

  validate-skills:
    name: スキル定義の検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SKILL.md の frontmatter を検証
        run: |
          set -euo pipefail
          fail=0
          for f in skills/*/SKILL.md; do
            echo "--- $f"

            # frontmatter が存在するか
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "  ERROR: frontmatter がありません" >&2
              fail=1
              continue
            fi

            # name と description が存在するか
            fm=$(awk '/^---$/{c++; next} c==1' "$f")
            for key in name description; do
              if ! echo "$fm" | grep -q "^${key}:"; then
                echo "  ERROR: ${key} がありません" >&2
                fail=1
              fi
            done

            # 本文が 500 行以内か (公式推奨)
            lines=$(wc -l < "$f" | tr -d ' ')
            if [ "$lines" -gt 500 ]; then
              echo "  ERROR: ${lines}行 (推奨は500行以内。references/ に分割してください)" >&2
              fail=1
            else
              echo "  OK (${lines}行)"
            fi

            # 開発マシン固有のパスに依存していないか
            # 外部利用者の環境には ~/.claude/ の自作スクリプトは存在しない
            if grep -q '~/\.claude/' "$f"; then
              echo "  ERROR: ~/.claude/ への依存があります (同梱スクリプトを使ってください)" >&2
              grep -n '~/\.claude/' "$f" | sed 's/^/    /' >&2
              fail=1
            fi

            # 裸の相対パス参照が残っていないか
            # 実行時の cwd は利用者のプロジェクトなので、
            # プラグイン内のファイルは ${CLAUDE_PLUGIN_ROOT} / ${CLAUDE_SKILL_DIR} で参照する
            if grep -qE '`references/[a-z0-9-]+\.md`' "$f"; then
              echo "  ERROR: 裸の references/ 参照があります" >&2
              grep -nE '`references/[a-z0-9-]+\.md`' "$f" | sed 's/^/    /' >&2
              fail=1
            fi

            # grep -n を glob + パイプで使っていないか
            # glob が1ファイルしかマッチしないとき grep はファイル名を出力しないため、
            # ファイル名を前提としたフィルタが全行を通過させてしまう
            if grep -qE 'grep -n[A-Za-z]* .*\*/' "$f"; then
              echo "  ERROR: glob 付きの grep に -H がありません" >&2
              grep -nE 'grep -n[A-Za-z]* .*\*/' "$f" | sed 's/^/    /' >&2
              fail=1
            fi
          done
          exit $fail

  validate-mermaid:
    name: Mermaid ブロックの検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: mermaid-cli をインストール
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Puppeteer の設定を用意
        # CI の Ubuntu では unprivileged user namespaces が無効で
        # Chromium がサンドボックス付きで起動できないため --no-sandbox を渡す
        run: |
          cat > /tmp/puppeteer.json <<'JSON'
          { "args": ["--no-sandbox", "--disable-setuid-sandbox"] }
          JSON

      # 同梱スクリプトをそのまま使う。
      # CI 専用の検証ロジックを別に持つと、
      # 利用者が実行するものと CI が検証するものが乖離するため。
      - name: Mermaid ブロックを検証
        env:
          PUPPETEER_CONFIG: /tmp/puppeteer.json
        run: |
          chmod +x scripts/check-mermaid.sh
          find . -name '*.md' -not -path './.git/*' -print0 \
            | xargs -0 scripts/check-mermaid.sh

  validate-d2:
    name: D2 検証スクリプトの動作確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: d2 をインストール
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: verify-d2.sh が Mermaid 記法の混入を検出できるか
        run: |
          set -euo pipefail
          chmod +x skills/infra-diagram/scripts/verify-d2.sh

          # 正常系: 期待値と一致するので exit 0
          printf 'a -> b\nq -> r: bad\n' > /tmp/ok.d2
          skills/infra-diagram/scripts/verify-d2.sh /tmp/ok.d2 4 2
          echo "正常系: OK"

          # 異常系: Mermaid 記法を混入させると exit 1 になるはず
          printf 'a -> b\nq -.|bad| r\n' > /tmp/trap.d2
          if skills/infra-diagram/scripts/verify-d2.sh /tmp/trap.d2 4 2; then
            echo "ERROR: Mermaid 記法の混入を検出できませんでした" >&2
            exit 1
          fi
          echo "異常系: OK (期待どおり検出)"
